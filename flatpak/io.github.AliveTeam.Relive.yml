# Flatpak manifest for the R.E.L.I.V.E engine (relive).
#
# Local test build:
#   flatpak-builder --force-clean --user --install build-dir-relive \
#       flatpak/io.github.AliveTeam.Relive.yml
#   flatpak run io.github.AliveTeam.Relive
#
# relive itself has no Flatpak-aware notion of a sandboxed data dir yet - it looks for a
# "relive_data" directory relative to its current working directory (see
# ResourceManagerWrapper::AddSearchPaths), the same way the AppImage's AppRun script cds into
# wherever the AppImage sits before exec'ing it. --filesystem=host is granted below so a user's
# existing relive_data can be reached; run it from the directory containing it, e.g.:
#   cd /path/with/relive_data && flatpak run io.github.AliveTeam.Relive
id: io.github.AliveTeam.Relive

# Pinned to the same Qt 5.15 branch the CI matrix installs for the editor - the top-level
# CMakeLists.txt add_subdirectory()s Source/Tools/editor unconditionally, and that in turn does
# a REQUIRED find_package(Qt5 ...), so Qt5 has to be present to configure the project at all
# even though relive itself doesn't link against it.
runtime: org.kde.Platform
runtime-version: '5.15-24.08'
sdk: org.kde.Sdk

command: relive

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --share=ipc
  - --device=dri
  - --filesystem=host
  # The root CMakeLists.txt builds every Unix target with ASan+LSan unconditionally (not gated
  # behind a Debug/opt-in flag - see the `elseif (UNIX)` branch there). LeakSanitizer's
  # stop-the-world leak scan needs ptrace, which bwrap's sandbox blocks, so it aborts on
  # startup with "LeakSanitizer has encountered a fatal error" unless leak detection is off.
  - --env=ASAN_OPTIONS=detect_leaks=0

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man

modules:
  - name: sdl3
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSDL_SHARED=ON
      - -DSDL_STATIC=OFF
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-3.4.14.tar.gz
        sha256: 30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb

  - name: relive
    buildsystem: simple
    build-commands:
      # Mirrors the CI Linux build (see .github/workflows/ci.yml) - Unix Makefiles, same
      # CMAKE_POLICY_VERSION_MINIMUM workaround the vendored 3rdParty projects need - but only
      # builds the relive target itself, not relive-editor/relive_api/tests.
      - cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCI_PROVIDER=Flatpak
      - make -C build -j${FLATPAK_BUILDER_N_JOBS:-$(nproc)} relive
      - install -Dm755 build/Source/relive/relive /app/bin/relive
      - install -Dm644 assets/relive-256.png /app/share/icons/hicolor/256x256/apps/io.github.AliveTeam.Relive.png
      - 'printf "%s\n" "[Desktop Entry]" "Name=R.E.L.I.V.E" "Comment=Open-source engine replacement for the classic Oddworld Abe games" "Exec=relive" "Icon=io.github.AliveTeam.Relive" "Type=Application" "Categories=Game;" > relive.desktop'
      - install -Dm644 relive.desktop /app/share/applications/io.github.AliveTeam.Relive.desktop
    sources:
      - type: dir
        path: ..
        # Copying the whole repo verbatim would drag in every native (host) build directory -
        # multiple gigabytes, and potentially stale CMakeCache.txt/absolute paths from those.
        skip:
          - build
          - build-*
          - .flatpak-builder
          - flatpak-repo
          - build-dir-*
          - .git
